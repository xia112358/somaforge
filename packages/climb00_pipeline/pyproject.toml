[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climb00-pipeline"
version = "0.1.0"
description = "Keyframe prediction and trajectory infilling pipeline for climb00."
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "somaforge-core", "motion-edit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["climb00_pipeline*"]
