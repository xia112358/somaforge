[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-edit"
version = "0.1.0"
description = "Motion edit layers, segment candidates, and export tools for Holosoma motion workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "numpy",
  "scipy",
  "somaforge-core",
  "trimesh",
  "uvicorn",
]

[project.scripts]
motion-edit = "motion_edit.cli:main"
motion-edit-seg = "motion_edit.segmentation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["motion_edit*"]

[tool.setuptools.package-data]
motion_edit = ["web_dist/**/*"]
