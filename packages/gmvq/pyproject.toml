[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmvq"
version = "0.1.0"
description = "Residual GM-VQ atom-skill tokenizer for SomaForge."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "somaforge-core",
    "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gmvq*"]
