[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-edit"
version = "0.1.0"
description = "Motion edit layers, segment candidates, and export tools for Holosoma motion workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
viewer = [
  "viser",
  "yourdfpy",
  "trimesh",
]

[project.scripts]
motion-edit = "motion_edit.cli:main"
motion-edit-bake-force = "motion_edit.contact_force.cli:main"
motion-edit-seg = "motion_edit.segmentation.cli:main"
motion-edit-seg-cutter = "motion_edit.segmentation.cutter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["motion_edit*"]
