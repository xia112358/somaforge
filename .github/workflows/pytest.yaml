name: Lightweight checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/holosoma/**'
      - 'packages/**'
      - 'tests/**'
      - 'apps/**'
      - 'baselines/**'
      - 'scripts/**'
      - 'configs/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'pyproject.toml'
    types:
      - opened
      - reopened
      - synchronize

jobs:
  static-checks:
    name: Static repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify active setup entrypoints
        shell: bash
        run: |
          test -f scripts/setup_isaaclab3_newton.sh
          test -f scripts/source_isaaclab3_newton_setup.sh
          test -f apps/holosoma.isaaclab3_newton.kit
          test -f apps/holosoma.isaaclab3_newton.headless.kit

      - name: Audit maintained source and configuration
        shell: bash
        run: |
          python scripts/check_repository.py

      - name: Check cleanup scope
        shell: bash
        run: |
          test -d src/holosoma_retargeting
          ! test -f scripts/setup_isaacgym.sh
          ! test -f scripts/setup_mujoco.sh
          ! test -d docs/vendor/isaaclab3_newton_refs
